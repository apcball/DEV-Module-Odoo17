<!DOCTYPE html>
<html>
<head>
    <title>Web Monitor Tool</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .header { background: #2196F3; color: white; padding: 20px; border-radius: 8px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .website-list { background: white; padding: 20px; margin-top: 20px; border-radius: 8px; }
        .website-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .status-online { color: green; font-weight: bold; }
        .status-offline { color: red; font-weight: bold; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #2196F3; color: white; }
        .form-group { margin: 15px 0; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 Web Monitor Dashboard</h1>
            <button class="btn btn-primary" onclick="showAddForm()">+ Add Website</button>
        </div>
        
        <div class="website-list">
            <h2>Monitored Websites</h2>
            <div id="websiteList"></div>
        </div>
        
        <!-- Add Website Form -->
        <div id="addForm" style="display:none; background:white; padding:20px; margin-top:20px; border-radius:8px;">
            <h3>Add New Website</h3>
            <div class="form-group">
                <label>Website Name:</label>
                <input type="text" id="siteName" placeholder="e.g. Google">
            </div>
            <div class="form-group">
                <label>URL:</label>
                <input type="text" id="siteUrl" placeholder="https://www.google.com">
            </div>
            <div class="form-group">
                <label>Check Interval (minutes):</label>
                <input type="number" id="siteInterval" value="5" min="1">
            </div>
            <div class="form-group">
                <label>Telegram Chat ID (optional):</label>
                <input type="text" id="siteTelegram" placeholder="@channel or 123456789">
            </div>
            <button class="btn btn-primary" onclick="addWebsite()">Save</button>
            <button class="btn" onclick="hideAddForm()">Cancel</button>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000/api';
        
        // Load websites
        async function loadWebsites() {
            try { // Bug 2: API Error Handling for loadWebsites
                const response = await fetch(`${API_URL}/websites`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const websites = await response.json();
                displayWebsites(websites);
            } catch (error) {
                console.error('Error loading websites:', error);
                document.getElementById('websiteList').innerHTML = '<p style="color:red">Error loading data. Please try again.</p>';
            }
        }
        
        // Display websites
        function displayWebsites(websites) {
            const container = document.getElementById('websiteList');
            if (websites.length === 0) {
                container.innerHTML = '<p>No websites monitored yet.</p>';
                return;
            }
            
            let html = '<table><tr><th>Name</th><th>URL</th><th>Status</th><th>Actions</th></tr>';
            websites.forEach(site => {
                // Bug 1: Changed status display to be dynamic
                html += `<tr>
                    <td>${site.name}</td>
                    <td>${site.url}</td>
                    <td><span id="status-${site.id}">⏳ Checking...</span></td>
                    <td><button onclick="deleteWebsite(${site.id})">Delete</button></td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }
        
        // Show add form
        function showAddForm() {
            document.getElementById('addForm').style.display = 'block';
        }
        
        // Hide add form
        function hideAddForm() {
            document.getElementById('addForm').style.display = 'none';
        }
        
        // Add website
        async function addWebsite() {
            const name = document.getElementById('siteName').value.trim(); // Added trim
            const url = document.getElementById('siteUrl').value.trim(); // Added trim
            const interval = document.getElementById('siteInterval').value;
            const telegram = document.getElementById('siteTelegram').value;
            
            // Bug 3: Added Client-side Validation
            if (!name) {
                alert('Please enter website name');
                return;
            }
            
            if (!url) {
                alert('Please enter URL');
                return;
            }
            
            // URL format validation
            try {
                new URL(url);
            } catch (e) {
                alert('Please enter a valid URL (e.g., https://www.example.com)');
                return;
            }
            
            // Bug 2: Added API Error Handling for addWebsite
            try {
                const response = await fetch(`${API_URL}/websites`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, url, check_interval: interval, telegram_chat_id: telegram })
                });
                
                if (!response.ok) {
                    // Attempt to get more specific error message from the server response
                    // This part might need adjustment if the backend doesn't send JSON errors
                    const errorData = await response.json().catch(() => ({ message: 'Unknown server error' })); 
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }
                
                hideAddForm();
                loadWebsites();
            } catch (error) {
                console.error('Error adding website:', error);
                alert('Failed to add website: ' + error.message);
            }
        }
        
        // Delete website
        async function deleteWebsite(id) {
            await fetch(`${API_URL}/websites/${id}`, { method: 'DELETE' });
            loadWebsites();
        }
        
        // Load on startup
        loadWebsites();
    </script>
</body>
</html>
