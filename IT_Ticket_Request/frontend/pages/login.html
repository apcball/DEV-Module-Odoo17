<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - IT Ticket Request</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body {
      background: linear-gradient(135deg, var(--color-primary-50) 0%, var(--color-white) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    
    .auth-container {
      width: 100%;
      max-width: 420px;
    }
    
    .auth-card {
      background: var(--color-white);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
      padding: var(--space-8);
    }
    
    .auth-logo {
      text-align: center;
      margin-bottom: var(--space-8);
    }
    
    .auth-logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-4);
    }
    
    .auth-logo-icon svg {
      width: 32px;
      height: 32px;
      color: var(--color-white);
    }
    
    .auth-logo h1 {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--color-gray-900);
    }
    
    .auth-logo p {
      color: var(--color-gray-500);
      margin-top: var(--space-1);
    }
    
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--color-gray-200);
      margin-bottom: var(--space-6);
    }
    
    .tab {
      flex: 1;
      padding: var(--space-3) var(--space-4);
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      color: var(--color-gray-500);
      background: none;
      border: none;
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
    }
    
    .tab.active {
      color: var(--color-primary);
    }
    
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--color-primary);
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-6);
    }
    
    .forgot-password {
      font-size: var(--text-sm);
      color: var(--color-primary);
      text-decoration: none;
    }
    
    .forgot-password:hover {
      text-decoration: underline;
    }
    
    .btn-submit {
      width: 100%;
      padding: var(--space-3);
      font-size: var(--text-base);
    }
    
    .auth-footer {
      text-align: center;
      margin-top: var(--space-6);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-gray-200);
      font-size: var(--text-sm);
      color: var(--color-gray-500);
    }
    
    .role-select {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
      margin-top: var(--space-2);
    }
    
    .role-option {
      position: relative;
    }
    
    .role-option input {
      position: absolute;
      opacity: 0;
    }
    
    .role-option label {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-4) var(--space-2);
      border: 2px solid var(--color-gray-200);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .role-option label:hover {
      border-color: var(--color-gray-300);
    }
    
    .role-option input:checked + label {
      border-color: var(--color-primary);
      background: var(--color-primary-50);
    }
    
    .role-option svg {
      width: 24px;
      height: 24px;
      color: var(--color-gray-400);
      margin-bottom: var(--space-2);
    }
    
    .role-option input:checked + label svg {
      color: var(--color-primary);
    }
    
    .role-option span {
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      color: var(--color-gray-600);
    }
    
    .role-option input:checked + label span {
      color: var(--color-primary);
    }
    
    .alert {
      margin-bottom: var(--space-4);
    }
    
    @media (max-width: 480px) {
      .auth-card {
        padding: var(--space-6);
      }
      
      .role-select {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
        </div>
        <h1>IT Ticket Request</h1>
        <p>ระบบแจ้งปัญหาและขอความช่วยเหลือ IT</p>
      </div>
      
      <div id="alert-container"></div>
      
      <div class="tabs">
        <button class="tab active" data-tab="login">เข้าสู่ระบบ</button>
        <button class="tab" data-tab="register">สมัครสมาชิก</button>
      </div>
      
      <!-- Login Form -->
      <div id="login-tab" class="tab-content active">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label required" for="login-email">อีเมล</label>
            <input type="email" id="login-email" class="form-input" placeholder="your@email.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label required" for="login-password">รหัสผ่าน</label>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
          </div>
          
          <div class="form-options">
            <label class="form-check">
              <input type="checkbox" class="form-check-input" id="remember-me">
              <span class="form-check-label">จดจำฉัน</span>
            </label>
            <a href="#" class="forgot-password" id="forgot-password-link">ลืมรหัสผ่าน?</a>
          </div>
          
          <button type="submit" class="btn btn-primary btn-submit" id="login-btn">
            เข้าสู่ระบบ
          </button>
        </form>
      </div>
      
      <!-- Register Form -->
      <div id="register-tab" class="tab-content">
        <form id="register-form">
          <div class="form-group">
            <label class="form-label required" for="reg-name">ชื่อ-นามสกุล</label>
            <input type="text" id="reg-name" class="form-input" placeholder="ชื่อ นามสกุล" required>
          </div>
          
          <div class="form-group">
            <label class="form-label required" for="reg-email">อีเมล</label>
            <input type="email" id="reg-email" class="form-input" placeholder="your@email.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="reg-phone">เบอร์โทรศัพท์</label>
            <input type="tel" id="reg-phone" class="form-input" placeholder="0812345678">
          </div>
          
          <div class="form-group">
            <label class="form-label required">บทบาท</label>
            <div class="role-select">
              <div class="role-option">
                <input type="radio" name="role" id="role-user" value="user" checked>
                <label for="role-user">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                  </svg>
                  <span>ผู้ใช้งาน</span>
                </label>
              </div>
              <div class="role-option">
                <input type="radio" name="role" id="role-agent" value="agent">
                <label for="role-agent">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                  </svg>
                  <span>เจ้าหน้าที่</span>
                </label>
              </div>
              <div class="role-option">
                <input type="radio" name="role" id="role-admin" value="admin">
                <label for="role-admin">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  </svg>
                  <span>ผู้ดูแล</span>
                </label>
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label required" for="reg-password">รหัสผ่าน</label>
            <input type="password" id="reg-password" class="form-input" placeholder="อย่างน้อย 8 ตัวอักษร" required>
            <p class="form-hint">รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร</p>
          </div>
          
          <div class="form-group">
            <label class="form-label required" for="reg-confirm-password">ยืนยันรหัสผ่าน</label>
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="btn btn-primary btn-submit" id="register-btn">
            สมัครสมาชิก
          </button>
        </form>
      </div>
      
      <div class="auth-footer">
        <p>© 2026 IT Ticket Request. All rights reserved.</p>
      </div>
    </div>
  </div>
  
  <!-- Forgot Password Modal -->
  <div id="forgot-modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">ลืมรหัสผ่าน</h3>
        <button class="modal-close" id="close-forgot-modal">×</button>
      </div>
      <div class="modal-body">
        <p class="text-gray-600 mb-4">กรุณากรอกอีเมลของคุณ เราจะส่งลิงก์สำหรับรีเซ็ตรหัสผ่านไปให้</p>
        <form id="forgot-form">
          <div class="form-group">
            <label class="form-label required">อีเมล</label>
            <input type="email" id="forgot-email" class="form-input" placeholder="your@email.com" required>
          </div>
          <button type="submit" class="btn btn-primary w-full" id="forgot-btn">ส่งลิงก์รีเซ็ต</button>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    // Check if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }
    
    // Tab switching
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetTab = tab.dataset.tab;
        
        // Update tab buttons
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // Update content
        document.querySelectorAll('.tab-content').forEach(content => {
          content.classList.remove('active');
        });
        document.getElementById(`${targetTab}-tab`).classList.add('active');
      });
    });
    
    // Login form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('login-btn');
      const alertContainer = document.getElementById('alert-container');
      
      Utils.DOM.setButtonLoading(btn, true);
      Utils.DOM.clearFormErrors(e.target);
      
      try {
        const response = await API.Auth.login({
          email: document.getElementById('login-email').value,
          password: document.getElementById('login-password').value
        });
        
        // Store token and user data
        localStorage.setItem('token', response.token);
        localStorage.setItem('user', JSON.stringify(response.user));
        
        if (document.getElementById('remember-me').checked) {
          localStorage.setItem('rememberEmail', document.getElementById('login-email').value);
        }
        
        window.location.href = 'dashboard.html';
      } catch (error) {
        Utils.DOM.showAlert(alertContainer, error.message, 'danger');
      } finally {
        Utils.DOM.setButtonLoading(btn, false);
      }
    });
    
    // Register form
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('register-btn');
      const alertContainer = document.getElementById('alert-container');
      
      // Validation
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;
      
      if (password !== confirmPassword) {
        Utils.DOM.showAlert(alertContainer, 'รหัสผ่านไม่ตรงกัน', 'danger');
        return;
      }
      
      if (password.length < 8) {
        Utils.DOM.showAlert(alertContainer, 'รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร', 'danger');
        return;
      }
      
      Utils.DOM.setButtonLoading(btn, true);
      Utils.DOM.clearFormErrors(e.target);
      
      try {
        const response = await API.Auth.register({
          name: document.getElementById('reg-name').value,
          email: document.getElementById('reg-email').value,
          password: password,
          phone: document.getElementById('reg-phone').value,
          role: document.querySelector('input[name="role"]:checked').value
        });
        
        Utils.DOM.showAlert(alertContainer, 'สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ', 'success');
        
        // Switch to login tab
        document.querySelector('[data-tab="login"]').click();
        document.getElementById('login-email').value = document.getElementById('reg-email').value;
        
        // Clear form
        e.target.reset();
      } catch (error) {
        Utils.DOM.showAlert(alertContainer, error.message, 'danger');
      } finally {
        Utils.DOM.setButtonLoading(btn, false);
      }
    });
    
    // Forgot password modal
    const forgotModal = document.getElementById('forgot-modal');
    
    document.getElementById('forgot-password-link').addEventListener('click', (e) => {
      e.preventDefault();
      forgotModal.classList.add('active');
    });
    
    document.getElementById('close-forgot-modal').addEventListener('click', () => {
      forgotModal.classList.remove('active');
    });
    
    forgotModal.addEventListener('click', (e) => {
      if (e.target === forgotModal) {
        forgotModal.classList.remove('active');
      }
    });
    
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('forgot-btn');
      
      Utils.DOM.setButtonLoading(btn, true);
      
      try {
        await API.Auth.forgotPassword(document.getElementById('forgot-email').value);
        alert('ส่งลิงก์รีเซ็ตรหัสผ่านไปยังอีเมลของคุณแล้ว');
        forgotModal.classList.remove('active');
      } catch (error) {
        alert(error.message);
      } finally {
        Utils.DOM.setButtonLoading(btn, false);
      }
    });
    
    // Load remembered email
    const rememberedEmail = localStorage.getItem('rememberEmail');
    if (rememberedEmail) {
      document.getElementById('login-email').value = rememberedEmail;
      document.getElementById('remember-me').checked = true;
    }
  </script>
</body>
</html>
