<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สร้าง Ticket ใหม่ - IT Ticket Request</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .create-form {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .form-card {
      background: var(--color-white);
      border: 1px solid var(--color-gray-200);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
    }
    
    .form-section {
      margin-bottom: var(--space-8);
    }
    
    .form-section:last-child {
      margin-bottom: 0;
    }
    
    .section-title {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      color: var(--color-gray-900);
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--color-gray-200);
    }
    
    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-4);
    }
    
    .priority-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-3);
    }
    
    .priority-option {
      position: relative;
    }
    
    .priority-option input {
      position: absolute;
      opacity: 0;
    }
    
    .priority-option label {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-4);
      border: 2px solid var(--color-gray-200);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }
    
    .priority-option label:hover {
      border-color: var(--color-gray-300);
    }
    
    .priority-option input:checked + label {
      border-color: var(--color-primary);
      background: var(--color-primary-50);
    }
    
    .priority-option input:checked + label.low {
      border-color: var(--color-priority-low);
      background: var(--color-success-light);
    }
    
    .priority-option input:checked + label.medium {
      border-color: var(--color-priority-medium);
      background: var(--color-warning-light);
    }
    
    .priority-option input:checked + label.high {
      border-color: var(--color-priority-high);
      background: var(--color-danger-light);
    }
    
    .priority-option input:checked + label.urgent {
      border-color: var(--color-priority-urgent);
      background: #EDE9FE;
    }
    
    .priority-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-2);
    }
    
    .priority-option label.low .priority-icon { background: var(--color-success-light); color: var(--color-success); }
    .priority-option label.medium .priority-icon { background: var(--color-warning-light); color: var(--color-warning); }
    .priority-option label.high .priority-icon { background: var(--color-danger-light); color: var(--color-danger); }
    .priority-option label.urgent .priority-icon { background: #EDE9FE; color: var(--color-priority-urgent); }
    
    .priority-name {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-gray-700);
    }
    
    .priority-option input:checked + label .priority-name {
      color: var(--color-gray-900);
      font-weight: var(--font-semibold);
    }
    
    .file-upload {
      border: 2px dashed var(--color-gray-300);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .file-upload:hover {
      border-color: var(--color-primary);
      background: var(--color-primary-50);
    }
    
    .file-upload.dragover {
      border-color: var(--color-primary);
      background: var(--color-primary-50);
    }
    
    .file-upload-icon {
      width: 48px;
      height: 48px;
      background: var(--color-gray-100);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-4);
    }
    
    .file-upload-icon svg {
      width: 24px;
      height: 24px;
      color: var(--color-gray-500);
    }
    
    .file-upload-text {
      font-size: var(--text-sm);
      color: var(--color-gray-600);
    }
    
    .file-upload-text strong {
      color: var(--color-primary);
    }
    
    .file-list {
      margin-top: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    
    .file-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      background: var(--color-gray-50);
      border-radius: var(--radius-md);
    }
    
    .file-item-icon {
      width: 40px;
      height: 40px;
      background: var(--color-white);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .file-item-icon svg {
      width: 20px;
      height: 20px;
      color: var(--color-gray-500);
    }
    
    .file-item-info {
      flex: 1;
      min-width: 0;
    }
    
    .file-item-name {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-gray-900);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .file-item-size {
      font-size: var(--text-xs);
      color: var(--color-gray-500);
    }
    
    .file-item-remove {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--color-gray-400);
      transition: all var(--transition-fast);
    }
    
    .file-item-remove:hover {
      background: var(--color-danger-light);
      color: var(--color-danger);
    }
    
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-3);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-gray-200);
    }
    
    @media (max-width: 768px) {
      .form-card {
        padding: var(--space-4);
      }
      
      .form-row {
        grid-template-columns: 1fr;
      }
      
      .priority-options {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .form-actions {
        flex-direction: column;
      }
      
      .form-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="dashboard.html" class="navbar-brand">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <span>IT Ticket</span>
      </a>
    </div>
    
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
        </svg>
        <span>แดชบอร์ด</span>
      </a>
      
      <a href="tickets.html" class="sidebar-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
        </svg>
        <span>รายการ Ticket</span>
      </a>
      
      <a href="create-ticket.html" class="sidebar-nav-item active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        <span>สร้าง Ticket</span>
      </a>
      
      <a href="profile.html" class="sidebar-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <span>โปรไฟล์</span>
      </a>
      
      <hr style="margin: var(--space-4) 0; border: none; border-top: 1px solid var(--color-gray-200);">
      
      <a href="#" class="sidebar-nav-item" id="logout-btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        <span>ออกจากระบบ</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">สร้าง Ticket ใหม่</h1>
        <p class="text-gray-500">แจ้งปัญหาหรือขอความช่วยเหลือจากทีม IT</p>
      </div>
    </div>
    
    <div class="create-form">
      <div id="alert-container"></div>
      
      <form id="create-ticket-form" class="form-card">
        <!-- Basic Info -->
        <div class="form-section">
          <h2 class="section-title">ข้อมูลทั่วไป</h2>
          
          <div class="form-group">
            <label class="form-label required" for="title">หัวข้อ</label>
            <input type="text" id="title" class="form-input" placeholder="ระบุหัวข้อสั้นๆ ที่อธิบายปัญหา" required>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label required" for="category">หมวดหมู่</label>
              <select id="category" class="form-select" required>
                <option value="">เลือกหมวดหมู่</option>
              </select>
            </div>
            
            <div class="form-group">
              <label class="form-label required">ความสำคัญ</label>
              <div class="priority-options">
                <div class="priority-option">
                  <input type="radio" name="priority" id="priority-low" value="low" checked>
                  <label for="priority-low" class="low">
                    <div class="priority-icon">
                      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14"></path>
                      </svg>
                    </div>
                    <span class="priority-name">ต่ำ</span>
                  </label>
                </div>
                
                <div class="priority-option">
                  <input type="radio" name="priority" id="priority-medium" value="medium">
                  <label for="priority-medium" class="medium">
                    <div class="priority-icon">
                      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                      </svg>
                    </div>
                    <span class="priority-name">ปานกลาง</span>
                  </label>
                </div>
                
                <div class="priority-option">
                  <input type="radio" name="priority" id="priority-high" value="high">
                  <label for="priority-high" class="high">
                    <div class="priority-icon">
                      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                      </svg>
                    </div>
                    <span class="priority-name">สูง</span>
                  </label>
                </div>
                
                <div class="priority-option">
                  <input type="radio" name="priority" id="priority-urgent" value="urgent">
                  <label for="priority-urgent" class="urgent">
                    <div class="priority-icon">
                      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z"></path>
                      </svg>
                    </div>
                    <span class="priority-name">เร่งด่วน</span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Description -->
        <div class="form-section">
          <h2 class="section-title">รายละเอียด</h2>
          
          <div class="form-group">
            <label class="form-label required" for="description">อธิบายปัญหา</label>
            <textarea id="description" class="form-textarea" rows="6" placeholder="อธิบายปัญหาของคุณอย่างละเอียด... 
ตัวอย่าง:
- ปัญหาที่พบ: ...
- ขั้นตอนที่ทำ: ...
- ผลลัพธ์ที่คาดหวัง: ..." required></textarea>
          </div>
        </div>

        <!-- Attachments -->
        <div class="form-section">
          <h2 class="section-title">ไฟล์แนบ (optional)</h2>
          
          <div class="file-upload" id="file-upload">
            <input type="file" id="file-input" multiple style="display: none;" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt">
            <div class="file-upload-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
              </svg>
            </div>
            <p class="file-upload-text">
              <strong>คลิกเพื่ออัปโหลด</strong> หรือลากไฟล์มาวางที่นี่
            </p>
            <p class="text-xs text-gray-400 mt-2">รองรับไฟล์รูปภาพ, PDF, Word, Excel (สูงสุด 10MB)</p>
          </div>
          
          <div class="file-list" id="file-list"></div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <a href="tickets.html" class="btn btn-secondary">ยกเลิก</a>
          <button type="submit" class="btn btn-primary" id="submit-btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 8px;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            สร้าง Ticket
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    // Check authentication
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
    }
    
    let uploadedFiles = [];
    
    // Load categories
    async function loadCategories() {
      try {
        const categories = await API.Categories.getCategories();
        const select = document.getElementById('category');
        categories.forEach(cat => {
          const option = document.createElement('option');
          option.value = cat.id;
          option.textContent = cat.name;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading categories:', error);
      }
    }
    
    // File upload handling
    const fileUpload = document.getElementById('file-upload');
    const fileInput = document.getElementById('file-input');
    const fileList = document.getElementById('file-list');
    
    fileUpload.addEventListener('click', () => fileInput.click());
    
    fileUpload.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileUpload.classList.add('dragover');
    });
    
    fileUpload.addEventListener('dragleave', () => {
      fileUpload.classList.remove('dragover');
    });
    
    fileUpload.addEventListener('drop', (e) => {
      e.preventDefault();
      fileUpload.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    
    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });
    
    function handleFiles(files) {
      Array.from(files).forEach(file => {
        if (file.size > 10 * 1024 * 1024) {
          alert(`ไฟล์ ${file.name} มีขนาดใหญ่เกินไป (สูงสุด 10MB)`);
          return;
        }
        uploadedFiles.push(file);
      });
      renderFileList();
    }
    
    function renderFileList() {
      fileList.innerHTML = uploadedFiles.map((file, index) => `
        <div class="file-item">
          <div class="file-item-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
          </div>
          <div class="file-item-info">
            <div class="file-item-name">${file.name}</div>
            <div class="file-item-size">${formatFileSize(file.size)}</div>
          </div>
          <button type="button" class="file-item-remove" onclick="removeFile(${index})">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      `).join('');
    }
    
    function removeFile(index) {
      uploadedFiles.splice(index, 1);
      renderFileList();
    }
    
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
    
    // Form submission
    document.getElementById('create-ticket-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submit-btn');
      const alertContainer = document.getElementById('alert-container');
      
      Utils.DOM.setButtonLoading(btn, true);
      Utils.DOM.clearFormErrors(e.target);
      
      try {
        const ticketData = {
          title: document.getElementById('title').value,
          description: document.getElementById('description').value,
          categoryId: document.getElementById('category').value,
          priority: document.querySelector('input[name="priority"]:checked').value
        };
        
        // TODO: Handle file uploads if backend supports multipart/form-data
        // For now, we'll just create the ticket without attachments
        
        const response = await API.Tickets.createTicket(ticketData);
        
        Utils.DOM.showAlert(alertContainer, 'สร้าง Ticket สำเร็จ! กำลังนำทาง...', 'success');
        
        setTimeout(() => {
          window.location.href = `ticket-detail.html?id=${response.id}`;
        }, 1000);
      } catch (error) {
        Utils.DOM.showAlert(alertContainer, error.message, 'danger');
      } finally {
        Utils.DOM.setButtonLoading(btn, false);
      }
    });
    
    // Logout
    document.getElementById('logout-btn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });
    
    // Initialize
    loadCategories();
  </script>
</body>
</html>
