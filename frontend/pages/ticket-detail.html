<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียด Ticket - IT Ticket Request</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .ticket-header {
      background: var(--color-white);
      border: 1px solid var(--color-gray-200);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      margin-bottom: var(--space-6);
    }
    
    .ticket-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }
    
    .ticket-id {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--color-gray-500);
      margin-bottom: var(--space-2);
    }
    
    .ticket-title {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--color-gray-900);
      margin-bottom: var(--space-4);
    }
    
    .ticket-meta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
    }
    
    .ticket-meta-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .ticket-meta-label {
      font-size: var(--text-sm);
      color: var(--color-gray-500);
    }
    
    .ticket-meta-value {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-gray-700);
    }
    
    .ticket-actions {
      display: flex;
      gap: var(--space-2);
      flex-shrink: 0;
    }
    
    .ticket-content {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: var(--space-6);
    }
    
    .ticket-main {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }
    
    .description-box {
      background: var(--color-white);
      border: 1px solid var(--color-gray-200);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
    }
    
    .description-title {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      color: var(--color-gray-900);
      margin-bottom: var(--space-4);
    }
    
    .description-text {
      font-size: var(--text-base);
      line-height: var(--leading-relaxed);
      color: var(--color-gray-700);
      white-space: pre-wrap;
    }
    
    /* Comments */
    .comments-section {
      background: var(--color-white);
      border: 1px solid var(--color-gray-200);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    
    .comments-header {
      padding: var(--space-4) var(--space-6);
      border-bottom: 1px solid var(--color-gray-200);
      background: var(--color-gray-50);
    }
    
    .comments-header h3 {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
    }
    
    .comments-list {
      padding: var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }
    
    .comment {
      display: flex;
      gap: var(--space-4);
    }
    
    .comment-avatar {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      color: var(--color-white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--font-semibold);
      font-size: var(--text-sm);
      flex-shrink: 0;
    }
    
    .comment-content {
      flex: 1;
    }
    
    .comment-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }
    
    .comment-author {
      font-weight: var(--font-semibold);
      color: var(--color-gray-900);
    }
    
    .comment-time {
      font-size: var(--text-sm);
      color: var(--color-gray-500);
    }
    
    .comment-text {
      font-size: var(--text-sm);
      color: var(--color-gray-700);
      line-height: var(--leading-relaxed);
      white-space: pre-wrap;
    }
    
    .comment-form {
      padding: var(--space-6);
      border-top: 1px solid var(--color-gray-200);
      background: var(--color-gray-50);
    }
    
    .comment-form-header {
      display: flex;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }
    
    .comment-input-wrapper {
      flex: 1;
    }
    
    .comment-input {
      min-height: 80px;
      resize: vertical;
    }
    
    /* Sidebar */
    .ticket-sidebar {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }
    
    .sidebar-card {
      background: var(--color-white);
      border: 1px solid var(--color-gray-200);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
    }
    
    .sidebar-card-title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-gray-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-4);
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--color-gray-100);
    }
    
    .info-row:last-child {
      border-bottom: none;
    }
    
    .info-label {
      font-size: var(--text-sm);
      color: var(--color-gray-500);
    }
    
    .info-value {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-gray-900);
    }
    
    .status-select {
      min-width: 140px;
    }
    
    .assignee-select {
      min-width: 160px;
    }
    
    /* Attachments */
    .attachment-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    
    .attachment-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      background: var(--color-gray-50);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: inherit;
      transition: background var(--transition-fast);
    }
    
    .attachment-item:hover {
      background: var(--color-gray-100);
    }
    
    .attachment-icon {
      width: 40px;
      height: 40px;
      background: var(--color-white);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .attachment-icon svg {
      width: 20px;
      height: 20px;
      color: var(--color-gray-500);
    }
    
    .attachment-info {
      flex: 1;
      min-width: 0;
    }
    
    .attachment-name {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-gray-900);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .attachment-size {
      font-size: var(--text-xs);
      color: var(--color-gray-500);
    }
    
    @media (max-width: 1024px) {
      .ticket-content {
        grid-template-columns: 1fr;
      }
      
      .ticket-header-top {
        flex-direction: column;
      }
      
      .ticket-actions {
        width: 100%;
      }
      
      .ticket-actions .btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="dashboard.html" class="navbar-brand">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <span>IT Ticket</span>
      </a>
    </div>
    
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
        </svg>
        <span>แดชบอร์ด</span>
      </a>
      
      <a href="tickets.html" class="sidebar-nav-item active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
        </svg>
        <span>รายการ Ticket</span>
      </a>
      
      <a href="create-ticket.html" class="sidebar-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        <span>สร้าง Ticket</span>
      </a>
      
      <a href="profile.html" class="sidebar-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <span>โปรไฟล์</span>
      </a>
      
      <hr style="margin: var(--space-4) 0; border: none; border-top: 1px solid var(--color-gray-200);">
      
      <a href="#" class="sidebar-nav-item" id="logout-btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        <span>ออกจากระบบ</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header">
      <a href="tickets.html" class="btn btn-ghost">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 8px;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        กลับไปรายการ
      </a>
    </div>
    
    <div id="ticket-container">
      <div class="text-center p-12">
        <div class="spinner mx-auto"></div>
        <p class="text-gray-500 mt-4">กำลังโหลด...</p>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    // Check authentication
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
    }
    
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const urlParams = new URLSearchParams(window.location.search);
    const ticketId = urlParams.get('id');
    
    if (!ticketId) {
      window.location.href = 'tickets.html';
    }
    
    let currentTicket = null;
    let agents = [];
    
    // Load ticket
    async function loadTicket() {
      try {
        const [ticket, comments] = await Promise.all([
          API.Tickets.getTicket(ticketId),
          API.Tickets.getComments(ticketId)
        ]);
        
        currentTicket = ticket;
        
        // Load agents for assign dropdown
        if (user.role === 'admin' || user.role === 'agent') {
          const agentsData = await API.Users.getUsers({ role: 'agent' });
          agents = agentsData.users || [];
        }
        
        renderTicket(ticket, comments);
      } catch (error) {
        console.error('Error loading ticket:', error);
        document.getElementById('ticket-container').innerHTML = `
          <div class="empty-state">
            <p class="text-danger">ไม่พบ Ticket หรือไม่มีสิทธิ์เข้าถึง</p>
            <a href="tickets.html" class="btn btn-primary mt-4">กลับไปรายการ</a>
          </div>
        `;
      }
    }
    
    function renderTicket(ticket, comments) {
      const isOwner = user.id === ticket.requesterId;
      const isAgent = user.role === 'agent' || user.role === 'admin';
      const canEdit = isOwner || isAgent;
      
      const html = `
        <div class="ticket-header">
          <div class="ticket-header-top">
            <div>
              <div class="ticket-id">Ticket #${ticket.id}</div>
              <h1 class="ticket-title">${ticket.title}</h1>
              <div class="ticket-meta">
                <div class="ticket-meta-item">
                  <span class="badge ${Utils.Status.getStatusBadgeClass(ticket.status)}">
                    ${Utils.Status.getStatusDisplayName(ticket.status)}
                  </span>
                </div>
                <div class="ticket-meta-item">
                  <span class="badge ${Utils.Status.getPriorityBadgeClass(ticket.priority)}">
                    ${Utils.Status.getPriorityDisplayName(ticket.priority)}
                  </span>
                </div>
                <div class="ticket-meta-item">
                  <span class="ticket-meta-label">สร้างเมื่อ:</span>
                  <span class="ticket-meta-value">${Utils.Date.formatDateTime(ticket.createdAt)}</span>
                </div>
              </div>
            </div>
            
            ${canEdit ? `
              <div class="ticket-actions">
                <a href="edit-ticket.html?id=${ticket.id}" class="btn btn-secondary">
                  <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 8px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                  </svg>
                  แก้ไข
                </a>
                ${isAgent ? `
                  <button class="btn btn-danger" onclick="deleteTicket()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 8px;">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    ลบ
                  </button>
                ` : ''}
              </div>
            ` : ''}
          </div>
        </div>

        <div class="ticket-content">
          <div class="ticket-main">
            <!-- Description -->
            <div class="description-box">
              <h3 class="description-title">รายละเอียด</h3>
              <div class="description-text">${ticket.description || 'ไม่มีรายละเอียด'}</div>
            </div>

            <!-- Comments -->
            <div class="comments-section">
              <div class="comments-header">
                <h3>ความคิดเห็น (${comments.length})</h3>
              </div>
              
              <div class="comments-list" id="comments-list">
                ${comments.length === 0 ? `
                  <div class="text-center text-gray-500 py-4">
                    ยังไม่มีความคิดเห็น
                  </div>
                ` : comments.map(comment => `
                  <div class="comment">
                    <div class="comment-avatar" style="background: ${getAvatarColor(comment.user?.name || '?')}">
                      ${(comment.user?.name || '?').charAt(0).toUpperCase()}
                    </div>
                    <div class="comment-content">
                      <div class="comment-header">
                        <span class="comment-author">${comment.user?.name || 'ไม่ระบุ'}</span>
                        <span class="comment-time">${Utils.Date.formatRelativeTime(comment.createdAt)}</span>
                      </div>
                      <div class="comment-text">${comment.content}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
              
              <form class="comment-form" id="comment-form">
                <div class="comment-form-header">
                  <div class="comment-avatar" style="background: ${getAvatarColor(user.name || '?')}">
                    ${(user.name || '?').charAt(0).toUpperCase()}
                  </div>
                  <div class="comment-input-wrapper">
                    <textarea class="form-input comment-input" id="comment-content" placeholder="เพิ่มความคิดเห็น..." required></textarea>
                  </div>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-sm text-gray-500">กด Ctrl+Enter เพื่อส่ง</span>
                  <button type="submit" class="btn btn-primary" id="submit-comment">
                    ส่งความคิดเห็น
                  </button>
                </div>
              </form>
            </div>
          </div>

          <div class="ticket-sidebar">
            <!-- Status & Assignment -->
            <div class="sidebar-card">
              <h4 class="sidebar-card-title">การจัดการ</h4>
              
              ${isAgent ? `
                <div class="info-row">
                  <span class="info-label">สถานะ</span>
                  <select class="form-select status-select" id="status-select" onchange="updateStatus(this.value)">
                    <option value="open" ${ticket.status === 'open' ? 'selected' : ''}>เปิด</option>
                    <option value="in_progress" ${ticket.status === 'in_progress' ? 'selected' : ''}>กำลังดำเนินการ</option>
                    <option value="pending" ${ticket.status === 'pending' ? 'selected' : ''}>รอดำเนินการ</option>
                    <option value="resolved" ${ticket.status === 'resolved' ? 'selected' : ''}>แก้ไขแล้ว</option>
                    <option value="closed" ${ticket.status === 'closed' ? 'selected' : ''}>ปิด</option>
                  </select>
                </div>
                
                <div class="info-row">
                  <span class="info-label">มอบหมายให้</span>
                  <select class="form-select assignee-select" id="assignee-select" onchange="assignTicket(this.value)">
                    <option value="">ยังไม่มอบหมาย</option>
                    ${agents.map(agent => `
                      <option value="${agent.id}" ${ticket.assignedTo === agent.id ? 'selected' : ''}>${agent.name}</option>
                    `).join('')}
                  </select>
                </div>
              ` : `
                <div class="info-row">
                  <span class="info-label">สถานะ</span>
                  <span class="badge ${Utils.Status.getStatusBadgeClass(ticket.status)}">
                    ${Utils.Status.getStatusDisplayName(ticket.status)}
                  </span>
                </div>
                
                <div class="info-row">
                  <span class="info-label">ผู้รับผิดชอบ</span>
                  <span class="info-value">${ticket.assignedToUser?.name || 'ยังไม่มอบหมาย'}</span>
                </div>
              `}
            </div>

            <!-- Details -->
            <div class="sidebar-card">
              <h4 class="sidebar-card-title">ข้อมูลเพิ่มเติม</h4>
              
              <div class="info-row">
                <span class="info-label">หมวดหมู่</span>
                <span class="info-value">${ticket.category?.name || 'ไม่ระบุ'}</span>
              </div>
              
              <div class="info-row">
                <span class="info-label">ผู้แจ้ง</span>
                <span class="info-value">${ticket.requester?.name || 'ไม่ระบุ'}</span>
              </div>
              
              <div class="info-row">
                <span class="info-label">อีเมล</span>
                <span class="info-value">${ticket.requester?.email || 'ไม่ระบุ'}</span>
              </div>
              
              <div class="info-row">
                <span class="info-label">อัปเดตล่าสุด</span>
                <span class="info-value">${Utils.Date.formatDateTime(ticket.updatedAt)}</span>
              </div>
            </div>

            <!-- Attachments -->
            ${ticket.attachments?.length > 0 ? `
              <div class="sidebar-card">
                <h4 class="sidebar-card-title">ไฟล์แนบ (${ticket.attachments.length})</h4>
                <div class="attachment-list">
                  ${ticket.attachments.map(att => `
                    <a href="${att.url}" target="_blank" class="attachment-item">
                      <div class="attachment-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                        </svg>
                      </div>
                      <div class="attachment-info">
                        <div class="attachment-name">${att.name}</div>
                        <div class="attachment-size">${formatFileSize(att.size)}</div>
                      </div>
                    </a>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
      
      document.getElementById('ticket-container').innerHTML = html;
      
      // Setup comment form
      document.getElementById('comment-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        await addComment();
      });
      
      // Ctrl+Enter to submit
      document.getElementById('comment-content').addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
          addComment();
        }
      });
    }
    
    function getAvatarColor(name) {
      const colors = ['#4F46E5', '#06B6D4', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899'];
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return colors[Math.abs(hash) % colors.length];
    }
    
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
    
    // Update status
    async function updateStatus(status) {
      try {
        await API.Tickets.updateStatus(ticketId, status);
        loadTicket();
      } catch (error) {
        alert(error.message);
      }
    }
    
    // Assign ticket
    async function assignTicket(userId) {
      try {
        await API.Tickets.assignTicket(ticketId, userId || null);
        loadTicket();
      } catch (error) {
        alert(error.message);
      }
    }
    
    // Add comment
    async function addComment() {
      const content = document.getElementById('comment-content').value.trim();
      if (!content) return;
      
      const btn = document.getElementById('submit-comment');
      Utils.DOM.setButtonLoading(btn, true);
      
      try {
        await API.Tickets.addComment(ticketId, content);
        document.getElementById('comment-content').value = '';
        loadTicket();
      } catch (error) {
        alert(error.message);
      } finally {
        Utils.DOM.setButtonLoading(btn, false);
      }
    }
    
    // Delete ticket
    async function deleteTicket() {
      if (!confirm('คุณแน่ใจหรือไม่ว่าต้องการลบ Ticket นี้?')) return;
      
      try {
        await API.Tickets.deleteTicket(ticketId);
        window.location.href = 'tickets.html';
      } catch (error) {
        alert(error.message);
      }
    }
    
    // Logout
    document.getElementById('logout-btn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });
    
    // Load ticket
    loadTicket();
  </script>
</body>
</html>
